# Nginx 反向代理配置 - 狮子英语 API
# 用途：将外部请求转发到 Docker 容器内的 API 服务

upstream xuebadict_api {
    # 负载均衡配置（可配置多个 API 副本）
    server api:5000 weight=1 max_fails=3 fail_timeout=30s;
    # server api2:5000 weight=1 max_fails=3 fail_timeout=30s;  # 如有多副本，可添加
    
    # 连接池配置
    keepalive 32;
}

# HTTP 重定向到 HTTPS（可选）
server {
    listen 80;
    server_name _;
    
    # 健康检查路径
    location /health {
        proxy_pass http://xuebadict_api;
        access_log off;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL 证书配置（需要替换为实际证书路径）
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 访问日志
    access_log /var/log/nginx/xuebadict_access.log;
    error_log /var/log/nginx/xuebadict_error.log;
    
    # 请求体大小限制（与 Flask 配置对应）
    client_max_body_size 16M;
    
    # 根路径
    location / {
        proxy_pass http://xuebadict_api;
        
        # 代理请求头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 连接配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # 重定向处理
        proxy_redirect off;
    }
    
    # API 文档路由
    location /api/docs {
        proxy_pass http://xuebadict_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 允许大型 Swagger 文件
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
    
    # API 规范文件
    location /apispec.json {
        proxy_pass http://xuebadict_api;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;  # 缓存 1 小时
        expires 1h;
    }
    
    # 健康检查端点（不记录日志）
    location /health {
        proxy_pass http://xuebadict_api;
        access_log off;
    }
    
    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://xuebadict_api;
        
        # 浏览器缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 代理缓存
        proxy_cache_valid 200 30d;
    }
    
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 上游服务器状态监控（可选）
# 需要在 docker-compose.yml 中额外开放一个 status 端口
server {
    listen 8080;
    server_name _;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
