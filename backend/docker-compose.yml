services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: xuebadict-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-xuebadict}
      MYSQL_USER: ${DB_USER:-xuebadict}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # SQL初始化脚本
      - ./xuebadict.sql:/docker-entrypoint-initdb.d/xuebadict.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - xuebadict-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: xuebadict-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - xuebadict-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 狮子英语 API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xuebadict-api
    environment:
      # Flask 配置
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-production-secret-key-change-this}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-production-jwt-secret-key}
      
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-xuebadict}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-xuebadict}
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://${DB_USER:-xuebadict}:${DB_PASSWORD:-123456}@mysql:3306/${DB_NAME:-xuebadict}?charset=utf8mb4
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      
      # 上传文件配置
      MAX_CONTENT_LENGTH: 16777216
      UPLOAD_FOLDER: /app/uploads
      
      # 日志配置
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/app.log
      
      # 分页配置
      PAGINATION_PAGE_SIZE: 20
      
      # 阿里云配置（可选）
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      
      # 微信支付配置（可选）
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      
      # 支付宝配置（可选）
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      
      # AI 服务配置（可选）
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据目录
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
      # 字典文件（只读）
      - ./dict:/app/dict:ro
      # 数据库文件（可选：如果使用SQLite）
      - ./instance:/app/instance
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xuebadict-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker 服务（用于异步任务）
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xuebadict-celery-worker
    command: celery -A services.tasks worker -l info
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://${DB_USER:-xuebadict}:${DB_PASSWORD:-123456}@mysql:3306/${DB_NAME:-xuebadict}?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - xuebadict-network

  # Flower 监控面板（Celery可视化）
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xuebadict-flower
    command: celery -A services.tasks flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    networks:
      - xuebadict-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  xuebadict-network:
    driver: bridge
